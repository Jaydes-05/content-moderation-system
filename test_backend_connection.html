<!DOCTYPE html>
<html>
<head>
    <title>Test Backend Connection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
        }
        .online {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .offline {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>ContentGuard Backend Connection Test</h1>
    
    <button onclick="testConnection()">Test Connection</button>
    
    <div id="result"></div>
    
    <h2>Instructions:</h2>
    <ol>
        <li>Make sure the backend is running: <code>python -m uvicorn api.main:app --reload</code></li>
        <li>Click "Test Connection" button above</li>
        <li>If it shows "OFFLINE", check the console for CORS errors</li>
    </ol>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="status">Testing connection...</div>';
            
            try {
                const response = await fetch('http://localhost:8000/health', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="status online">
                            ✅ BACKEND IS ONLINE!
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="status offline">
                            ❌ Backend returned error: ${response.status}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status offline">
                        ❌ BACKEND IS OFFLINE
                        <p>Error: ${error.message}</p>
                        <p>Make sure the backend is running on http://localhost:8000</p>
                    </div>
                `;
                console.error('Connection error:', error);
            }
        }
        
        // Auto-test on load
        window.onload = () => {
            setTimeout(testConnection, 500);
        };
    </script>
</body>
</html>
